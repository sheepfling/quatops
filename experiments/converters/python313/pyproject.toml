[project]
name = "quatops-python313-captures"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["quatops-experiments", "pydantic==2.14.2", "typing-inspection==0.4.4"]

[project.optional-dependencies]
eigen = ["quatops-experiments[eigen]"]
opencv = ["quatops-experiments[opencv]"]

[tool.uv]
package = false

[tool.uv.sources]
quatops-experiments = { path = "../..", editable = true }
