[metadata]
name = quatops
version = 0.1.0
description = Small, explicit scalar and NumPy quaternion operations
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.extras_require]
numpy =
    numpy>=1.20
dev =
    numpy>=1.20
    scipy>=1.7

[options.package_data]
quatops = py.typed
