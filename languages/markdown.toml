[[orchestration.steps]]
kind = "command"
name = "Markdown style"
argv = ["rumdl", "check", "--no-cache", "{files}"]
fix_argv = ["rumdl", "fmt", "{files}"]
files = {
  include = ["**/*.[mM][dD]", "*.[mM][dD]"],
  exclude = ["experiments/quatops_capture_wave2/**"],
}

[[orchestration.steps]]
kind = "command"
name = "Markdown links and graph"
argv = [
  "{python}", "-m", "mdrepo", "--root", "{root}", "--config",
  "{root}/mdrepo.toml", "check", "{files}",
]
fix_argv = [
  "{python}", "-m", "mdrepo", "--root", "{root}", "--config",
  "{root}/mdrepo.toml", "fix", "{files}",
]
files = {
  include = ["**/*.[mM][dD]", "*.[mM][dD]"],
  exclude = ["experiments/quatops_capture_wave2/**"],
}

[[orchestration.profiles]]
name = "markdown"
steps = ["Markdown style", "Markdown links and graph"]
