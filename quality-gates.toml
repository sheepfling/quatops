schema_version = 1
orchestration_files = [
  "languages/python.toml",
  "languages/pydantic.toml",
  "languages/markdown.toml",
  "languages/json.toml",
  "languages/yaml.toml",
  "languages/toml.toml",
]

[files]
include = [
  "src/**/*.py", "tests/**/*.py", "experiments/**/*.py", "scripts/**/*.py",
  "*.md", "**/*.md", "*.json", "**/*.json", "*.yaml", "**/*.yaml",
  "*.yml", "**/*.yml", "*.toml", "**/*.toml",
]
[checks.json_structure]
extensions = [".py"]
# Test decoders consume controlled fixtures; the benchmark reads its own
# pytest-benchmark report, whose schema belongs to that local tool.
exclude = [
  "tests/**",
  # This reader rejects duplicate keys and non-finite/non-standard values,
  # then validates the decoded tree through Pydantic RootModels. Alphus's
  # source rule cannot follow that validated data flow.
  "scripts/evidence_json.py",
  "experiments/one_off_benchmark.py",
  # These scripts execute inside pinned native SDK environments. Keep their
  # standard-library JSON boundary independent of a Pydantic runtime dependency;
  # their inputs and outputs are validated by native replay tests and JSON syntax.
  "experiments/converters/mujoco/3.17.0/capture_native.py",
  "experiments/converters/opencv/4.13.0/capture_native.py",
  "experiments/converters/opencv/4.13.0/prepare_inputs.py",
  "experiments/converters/ros2/0.36.23/capture_native.py",
  "experiments/converters/openusd/26.11/capture_native.py",
  "experiments/converters/openusd/26.11/create_stage.py",
  "experiments/converters/spiceypy/8.3.0/capture_native.py",
  "experiments/oracles/mujoco/3.17.0/capture_mujoco.py",
  "experiments/oracles/proj/9.5.1/capture_proj.py",
  "experiments/oracles/spiceypy/8.3.0/capture_spice.py",
  "experiments/transports/openusd/26.11/capture_openusd.py",
]

[checks.output_escaping]
extensions = [".py"]
exclude = []

[checks.path_discovery]
extensions = [".py"]
# These checkout-local tools intentionally discover the source tree.
exclude = [
  "experiments/one_off_benchmark.py",
  "experiments/run.py",
  # Repository-relative roots are deliberate for fixture locators and capture
  # entrypoints; they are not runtime package imports.
  "experiments/converters/cesium/1.124.0/create_inputs.py",
  "experiments/converters/gltf/2.0.0/create_asset.py",
  "experiments/converters/opencv/4.13.0/prepare_inputs.py",
  "experiments/converters/ros2/0.36.23/capture_native.py",
  "experiments/converters/openusd/26.11/create_stage.py",
  "experiments/converters/eigen/5.0.1/capture_native.py",
  "experiments/oracles/proj/9.5.1/capture_proj.py",
  "experiments/oracles/shared/capture_io.py",
  "scripts/**",
  "tests/**",
]
inspection_exclude = ["tests/**"]

[checks.line_length]
exclude = []

[checks.line_length.limits]
".py" = 120

[checks.file_size]
code_extensions = [".py"]
code_limit = 3000
hard_limit = 5000
initializer_name = "__init__.py"
initializer_limit = 100
# These two JSON files are generated input corpora with stable case IDs. They
# remain under JSON syntax and consumer checks; line count is not code size.
exclude = [
  "experiments/oracles/shared/orientation_inputs_v1.json",
]

[checks.numeric_literals]
extensions = [".py"]
exclude = ["tests/**"]

[checks.test_quality]
extensions = [".py"]
exclude = []
test_paths = ["tests/**"]

[checks.source_families]
extensions = [".py"]
include = ["src/**/*.py"]
exclude = ["**/tests/**"]
min_family_files = 5
min_prefix_characters = 4

[checks.pydantic_practices]
extensions = [".py"]
exclude = []
report_dump_revalidation = true
report_deprecated_v1_apis = true
report_unvalidated_construct = true
report_unvalidated_copy_update = true
report_validator_fallthrough = true
report_field_positional_default = true
report_custom_init = true
report_unconstrained_any = true
public_model_paths = [
  "src/**/*.py",
  "scripts/converter_evidence.py",
  "scripts/evidence_json.py",
]

[orchestration]
default_profile = "review"
failure_threshold = "warning"

[[orchestration.profiles]]
name = "review"
includes = ["python-review", "pydantic", "markdown", "json", "yaml", "toml"]
