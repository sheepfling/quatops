    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    uses: sheepfling/alphus/.github/workflows/reusable-consumer-quality.yml@77b191b8bdf1fc4cfb50c6f3e4518be297f3d3ee
