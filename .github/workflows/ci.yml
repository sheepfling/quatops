name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-bundle-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Check capture environment locks
        run: |
          python -m pip install uv==0.11.28
          python -m scripts.verify lock
      - name: Build evidence bundle
        run: >-
          python -m scripts.package_evidence_bundle
          --repository-root .
          --output "$RUNNER_TEMP/quatops-evidence-bundle.zip"
      - name: Extract and verify replay inputs
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          archive_path = runner_temp / "quatops-evidence-bundle.zip"
          destination = runner_temp / "quatops-evidence-replay"
          with ZipFile(archive_path) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              for required in (
                  "tests/support/paths.py",
                  "tests/support/native_engine_support.py",
                  "scripts/evidence_json.py",
                  "scripts/validate_evidence_json.py",
                  "scripts/validate_converter_evidence.py",
              ):
                  assert required in names, required
              assert not any("/node_modules/" in name for name in names)
              archive.extractall(destination)
          PY
      - name: Install isolated bundle environment
        run: |
          python -m venv "$RUNNER_TEMP/evidence-venv"
          "$RUNNER_TEMP/evidence-venv/bin/python" -m pip install "$RUNNER_TEMP/quatops-evidence-replay[dev]"
      - name: Replay validations from extracted bundle
        working-directory: ${{ runner.temp }}/quatops-evidence-replay
        run: |
          "$RUNNER_TEMP/evidence-venv/bin/python" -m scripts.validate_evidence_json --repository-root .
          "$RUNNER_TEMP/evidence-venv/bin/python" -m scripts.validate_converter_evidence --repository-root .
          "$RUNNER_TEMP/evidence-venv/bin/python" -m scripts.render_converter_registry --repository-root . --check
          "$RUNNER_TEMP/evidence-venv/bin/python" -m pytest -q tests/quatops/experimental/semantics tests/quatops/experimental/converters tests/quatops/experimental/engines/test_canonical_interoperability.py

  test:
    # Ubuntu 26.04 does not provide the CPython 3.9 build used by this matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests and evidence checks
        run: python -m scripts.verify ci

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - name: Install development and type-check dependencies
        run: python -m pip install -e ".[dev,typecheck]"
      - name: Check types with Pyright
        run: python -m scripts.verify typecheck

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build and exercise installed distributions
        run: python -m scripts.verify package
