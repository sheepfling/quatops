name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-bundle-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Build evidence bundle
        run: >-
          python -m scripts.package_evidence_bundle
          --repository-root .
          --output "$RUNNER_TEMP/quatops-evidence-bundle.zip"
      - name: Extract and verify replay inputs
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          archive_path = runner_temp / "quatops-evidence-bundle.zip"
          destination = runner_temp / "quatops-evidence-replay"
          with ZipFile(archive_path) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              for required in (
                  "tests/support/paths.py",
                  "tests/support/native_engine_support.py",
                  "scripts/evidence_json.py",
                  "scripts/validate_evidence_json.py",
                  "scripts/validate_converter_evidence.py",
              ):
                  assert required in names, required
              assert not any("/node_modules/" in name for name in names)
              archive.extractall(destination)
          PY
      - name: Install isolated bundle environment
        run: |
          python -m venv "$RUNNER_TEMP/evidence-venv"
          "$RUNNER_TEMP/evidence-venv/bin/python" -m pip install "$RUNNER_TEMP/quatops-evidence-replay[dev]"
      - name: Replay validations from extracted bundle
        working-directory: ${{ runner.temp }}/quatops-evidence-replay
        run: |
          "$RUNNER_TEMP/evidence-venv/bin/python" -m scripts.validate_evidence_json --repository-root .
          "$RUNNER_TEMP/evidence-venv/bin/python" -m scripts.validate_converter_evidence --repository-root .
          "$RUNNER_TEMP/evidence-venv/bin/python" -m scripts.render_converter_registry --repository-root . --check
          "$RUNNER_TEMP/evidence-venv/bin/python" -m pytest -q tests/quatops/experimental/semantics tests/quatops/experimental/converters tests/quatops/experimental/engines/test_canonical_interoperability.py

  test:
    # Ubuntu 26.04 does not provide the CPython 3.9 build used by this matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate retained evidence JSON
        run: python -m scripts.validate_evidence_json --repository-root .
      - name: Validate converter evidence packages
        run: python -m scripts.validate_converter_evidence --repository-root .
      - name: Check generated converter registry documentation
        run: python -m scripts.render_converter_registry --repository-root . --check
      - name: Run tests
        run: python -m pytest -q
      - name: Check types
        run: mypy tests/typing_tests/foundational_consumer.py tests/typing_tests/consumer.py tests/typing_tests/float32_consumer.py
      - name: Check lint
        run: ruff check src tests examples experiments
      - name: Check example formatting
        run: ruff format --check examples
      - name: Check evidence tooling lint and formatting
        run: |
          ruff check --select B,C4,E4,PERF,RUF,SIM,UP experiments/oracles experiments/converters scripts
          ruff format --check experiments scripts

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - name: Install development and type-check dependencies
        run: python -m pip install -e ".[dev,typecheck]"
      - name: Check types with Pyright
        run: pyright --pythonpath "$(command -v python)"

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              caches = [
                  name
                  for name in archive.namelist()
                  if name.endswith((".nbc", ".nbi")) or "/__pycache__/" in name
              ]
          assert not caches, caches
          PY
      - name: Install and import the built wheel
        run: |
          python -m pip install --no-deps --target .package-smoke dist/*.whl
          PYTHONPATH=.package-smoke python - <<'PY'
          import sys

          import quatops
          from quatops.experimental.converters import OrientationConverter, accepted_converters
          from quatops.experimental.semantics import (
              CANONICAL_BODY_RFU,
              CANONICAL_WORLD_RFU,
              PhysicalOrientation,
          )

          assert len(accepted_converters()) == 14
          assert "numpy" not in sys.modules
          world = CANONICAL_WORLD_RFU.bind("wheel.world", "wheel.world.reference")
          body = CANONICAL_BODY_RFU.bind("wheel.body", "wheel.body.reference")
          converter = OrientationConverter("unity.quaternion", world, body, world, body)
          orientation = PhysicalOrientation.from_wxyz(
              (0.8, 0.2, -0.4, 0.4), world, body
          )
          native = converter.to_target(orientation)
          assert native.values == (0.2, -0.4, 0.4, 0.8)
          assert converter.from_target(native).quaternion_wxyz == orientation.quaternion_wxyz
          print(quatops.__version__)
          PY
          python -m pip install --target .package-smoke "numpy>=1.20"
          PYTHONPATH=.package-smoke python - <<'PY'
          import numpy as np

          from quatops.experimental.converters import OrientationConverter
          from quatops.experimental.semantics import (
              CANONICAL_BODY_RFU,
              CANONICAL_WORLD_RFU,
              PhysicalOrientationBatch,
          )

          world = CANONICAL_WORLD_RFU.bind("wheel.world", "wheel.world.reference")
          body = CANONICAL_BODY_RFU.bind("wheel.body", "wheel.body.reference")
          converter = OrientationConverter("unity.quaternion", world, body, world, body)
          values = np.asarray(
              ((0.8, 0.2, -0.4, 0.4), (0.8, 0.2, -0.4, 0.4)),
              dtype=np.float32,
          ).T
          native = converter.to_target_batch(
              PhysicalOrientationBatch(values, world, body), component_axis=0
          )
          assert native.component_axis == 0
          recovered = converter.from_target_batch(native)
          np.testing.assert_array_equal(recovered.values, values)
          PY
